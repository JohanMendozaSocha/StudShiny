{% extends "core/admin/base_admin.html" %}
{% block admin_content %}
<div class="actions"><h1>Clientes</h1><a class="button" href="{% url 'cliente_create' %}">Nuevo cliente</a></div>
<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Documento</th><th>Correo</th><th>Telefono</th><th></th></tr></thead><tbody>
{% for c in clientes %}<tr><td>{{ c.nombre_completo }}</td><td>{{ c.numero_documento }}</td><td>{{ c.correo }}</td><td>{{ c.telefono }}</td><td class="actions"><a class="button light" href="{% url 'cliente_update' c.id %}">Editar</a><a class="button danger" href="{% url 'cliente_delete' c.id %}">Eliminar</a></td></tr>{% empty %}<tr><td colspan="5">Sin clientes.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
